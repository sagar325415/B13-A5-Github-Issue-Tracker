<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Page</title>
    <!-- tailwind and daisyUi -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css">
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body>


     <!-- header section -->
    <header class="flex justify-between px-10 py-5 mb-3">
  
      <!-- navbar section -->

        <div class="flex items-center gap-1">
            <img class="w-[35px]" src="./assets/github-logo.png" alt="">
            <h2>GitHub Issues Tracker</h2>
        </div>


        <div>
            <div class="join">
                <div>
                    <label class="input validator join-item">
                        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                                stroke="currentColor">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.3-4.3"></path>
                            </g>
                        </svg>
                        <input id="input-search" type="text" placeholder="Search issues..." required />
                    </label>
                </div>
                <button id="searchBtn" class="btn text-[#64748B] active">+ New Issue</button>
            </div>

        </div>

    </header>

            <!-- buttons -->

    <div class="container mx-auto mb-4">
        <button onclick="toggle('all')" id="all" class="btn text-[#64748B] active px-10">All</button>
        <button onclick="toggle('open')" id="open" class="btn text-[#64748B] bg-white px-10">Open</button>
        <button onclick="toggle('closed')" id="closed" class="btn text-[#64748B] bg-white  px-10">Closed</button>
    </div>

    
</body>

</html>
