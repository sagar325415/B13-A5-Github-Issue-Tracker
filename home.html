<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Page</title>
    <!-- tailwind and daisyUi -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css">
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body>


     <!-- header section -->
    <header class="flex justify-between px-10 py-5 mb-3">
  
      <!-- navbar section -->

        <div class="flex items-center gap-1">
            <img class="w-[35px]" src="./assets/github-logo.png" alt="">
            <h2>GitHub Issues Tracker</h2>
        </div>


        <div>
            <div class="join">
                <div>
                    <label class="input validator join-item">
                        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                                stroke="currentColor">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.3-4.3"></path>
                            </g>
                        </svg>
                        <input id="input-search" type="text" placeholder="Search issues..." required />
                    </label>
                </div>
                <button id="searchBtn" class="btn text-[#64748B] active">+ New Issue</button>
            </div>

        </div>

    </header>

            <!-- buttons -->

    <div class="container mx-auto mb-4">
        <button onclick="toggle('all')" id="all" class="btn text-[#64748B] active px-10">All</button>
        <button onclick="toggle('open')" id="open" class="btn text-[#64748B] bg-white px-10">Open</button>
        <button onclick="toggle('closed')" id="closed" class="btn text-[#64748B] bg-white  px-10">Closed</button>
    </div>


    <!-- cards section -->
    <div class="container mx-auto p-4 border border-gray-100 rounded-lg">
        <div class="flex items-center justify-between">

            <div class="flex items-center gap-4">
                <div class="bg-purple-100 p-3 rounded-full flex items-center justify-center">
                    <img src="./assets/Aperture.png" alt="Icon" class="w-6 h-6">
                </div>
                <div>
                    <div class="flex items-center gap-1">
                        <span id="counter" class="text-xl font-bold">50</span>
                        <h2 class="text-xl font-bold text-gray-800">Issues</h2>
                    </div>
                    <p class="text-gray-500 text-sm">Track and manage your project issues</p>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-[#00A96E] rounded-full"></span>
                    <span class="text-gray-700 font-medium">Open</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-[#A855F7] rounded-full"></span>
                    <span class="text-gray-700 font-medium">Closed</span>
                </div>
            </div>

        </div>
    </div>

    </div>


    <!-- filter section -->
    <main class="container mx-auto mt-4">

        <section id="allCardSection" class="grid grid-cols-4 gap-3 mt-3">

        </section>
        <section id="spinner" class="flex justify-center items-center py-10 hidden">
            <span class="loading loading-bars loading-xl"></span>
        </section>

        <dialog id="allCard" class="modal">
            <div class="modal-box">

            </div>
        </dialog>
    </main>
    <script src="./style.js"></script>
</body>

</html>
